name: Train Drug Classification Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow

      - name: 🤖 Train Model with MLflow
        run: |
          cd MLProject
          python modelling.py

      - name: 📊 Display Run Info
        run: |
          cd MLProject
          if [ -f run_info.txt ]; then
            echo "=== Model Training Results ==="
            cat run_info.txt
          else
            echo "⚠️ run_info.txt not found"
          fi

      - name: ✅ Training Complete
        run: |
          echo "🎉 Model training completed successfully!"
          echo "✓ Workflow executed at: $(date)"
